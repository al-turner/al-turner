# Redraws the contribution crop circles from the last year's contributions, once a day. The images go
# to the `output` branch, force-pushed as a single commit so the repo doesn't grow with every redraw.
name: Contribution Crop Circles

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: crop-circles
      - name: Fetch the contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount weekday } } } } } }' \
            -f login='${{ github.repository_owner }}' \
            --jq '.data.user.contributionsCollection.contributionCalendar' > crop-circles/calendar.json
      - run: node generate.mjs calendar.json out
        working-directory: crop-circles
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: crop-circles/out
        run: |
          git init -q -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -q -m 'Redraw the contribution crop circles'
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
